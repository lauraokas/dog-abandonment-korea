<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Timeline</title>
<link rel="stylesheet" href="theme.css">
<style>
/* One timeline for every country: a block per category, a row per country inside it, one shared year axis.
   Data comes from data/*.js. Colours, rules and fonts come from theme.css.

   Accessibility: nothing here depends on colour alone.
   - Category: the block it sits in and its caption (colour is a bonus).
   - Country: the label on its row, plus a marker shape (filled circle, open diamond, filled square, filled triangle),
     a bar pattern (plain, stripes, dots, lines) and a label style (filled, outlined, dashed, double).
   - Pressed buttons: a tick and an underline, not only the yellow fill.
   - Selected marker: a heavy ring and a highlighted label.
   - Every click target is at least 24 px, and a "List" view gives the same events as a plain table. */
:root { --lw: 124px; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.page { max-width: 1480px; margin: 0 auto; padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font-family: var(--f-body); }
a:focus-visible, button:focus-visible, .tl:focus-visible, .panel:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--highlight); color: var(--ink); font-weight: 600; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 6px; }
.skip:focus { left: 12px; }

.back { font-size: 13px; font-weight: 500; color: var(--ink2); text-decoration: none; display: inline-block; padding: 6px 0; min-height: 28px; }
.back:hover { color: var(--ink); text-decoration: underline; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(28px, 4.4vw, 42px); line-height: 1.1; margin: 10px 0 0; text-wrap: balance; }
.sub { color: var(--ink2); margin: 8px 0 0; max-width: 72ch; }

/* controls: three different kinds, so they look and behave differently.
   Countries = a filter (tick any), View and Time scale = switches (pick one), Jump to = links that move the chart. */
.toolbar { display: flex; flex-wrap: wrap; gap: 16px 34px; align-items: flex-start; margin: 22px 0 14px; }
.toolbar [hidden] { display: none; }
.tgroup { display: block; border: 0; margin: 0; padding: 0; min-width: 0; }
.tgroup .gl { padding: 0; margin: 0 0 7px; font: 600 12px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chk { position: relative; display: inline-flex; align-items: center; gap: 9px; min-height: 36px; padding: 4px 14px 4px 9px; border-radius: 8px; background: var(--band); font: 500 13px var(--f-body); cursor: pointer; }
.chk:hover { background: color-mix(in srgb, var(--band) 65%, var(--highlight)); }
.chk input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chk .box { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: var(--card); box-shadow: inset 0 0 0 2px var(--edge); }
.chk .box::after { content: ""; width: 11px; height: 6px; border-left: 3px solid var(--on-bar); border-bottom: 3px solid var(--on-bar); transform: translateY(-1px) rotate(-45deg); opacity: 0; }
.chk input:checked + .box { background: var(--ink); box-shadow: none; }
.chk input:checked + .box::after { opacity: 1; }
.chk input:checked ~ .nm { font-weight: 700; }
.chk input:focus-visible + .box { outline: 3px solid var(--ink); outline-offset: 2px; }
.segr { display: inline-flex; gap: 3px; padding: 3px; border-radius: 10px; background: var(--band); }
.sw { position: relative; display: inline-flex; cursor: pointer; }
.sw input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw .t { display: inline-flex; align-items: center; min-height: 32px; padding: 5px 15px; border-radius: 7px; font: 500 13px var(--f-body); color: var(--ink); }
.sw:hover .t { background: color-mix(in srgb, var(--card) 65%, transparent); }
.sw input:checked + .t { background: var(--ink); color: var(--on-bar); font-weight: 600; }
.sw input:focus-visible + .t { outline: 3px solid var(--ink); outline-offset: 2px; }
.jumpset { display: flex; flex-wrap: wrap; gap: 2px 4px; }
.jumpset button { min-height: 32px; font: 500 13px var(--f-body); color: var(--ink); background: transparent; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; text-decoration-color: var(--rule-strong); }
.jumpset button::after { content: " →"; content: " →" / ""; }
.jumpset button:hover { background: var(--highlight); text-decoration-color: var(--ink); }
.key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin: 0 0 10px; font-size: 13px; color: var(--ink2); }
.key b { font-weight: 600; color: var(--ink); }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--lc); margin-right: 6px; vertical-align: -1px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr) 420px; }
  .panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
}

/* country identity: shape icon + label style, never colour alone */
.ico { flex: none; display: inline-block; vertical-align: -3px; }
.ico .fill { fill: currentColor; }
.ico .open { fill: none; stroke: currentColor; stroke-width: 3.6; stroke-linejoin: round; }
.ct { display: inline-flex; align-items: center; gap: 7px; font: 600 12.5px/1.2 var(--f-body); color: var(--ink); background: var(--card); border-radius: 5px; padding: 4px 9px 4px 7px; white-space: nowrap; }
.ct.v0 { background: var(--ink); color: var(--on-bar); }
.ct.v1 { background: color-mix(in srgb, var(--ink) 12%, var(--card)); }
.ct.v2 { background: color-mix(in srgb, var(--ink) 28%, var(--card)); }
.ct.v3 { background: var(--highlight); }

/* the chart */
.tl { position: relative; overflow: auto; background: var(--card); border: 3px solid var(--rule); border-radius: 10px; }
@media (min-width: 900px) { .tl { max-height: calc(100vh - 200px); min-height: 380px; } }
.canvas { position: relative; width: calc(var(--lw) + var(--tw)); }
.row { display: flex; }
.lbl { position: sticky; left: 0; z-index: 4; flex: none; width: var(--lw); background: var(--card); padding: 12px 8px; }
.tl.scrolled .lbl:not(.capl) { box-shadow: 6px 0 8px -6px rgba(57, 62, 65, 0.18); }
.track { position: relative; flex: none; width: var(--tw); z-index: 2; }

.head { position: sticky; top: 0; z-index: 6; background: var(--card); }
.head .lbl { z-index: 7; }
.eras { height: 36px; }
.eras .lbl, .axis .lbl { padding-block: 5px; display: flex; align-items: center; }
.era { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ink) 8%, var(--card)); color: var(--ink); font: 600 12px var(--f-body); letter-spacing: 0.04em; text-transform: uppercase; padding: 7px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.era.alt { background: color-mix(in srgb, var(--ink) 16%, var(--card)); }
.axis { height: 32px; background: var(--ink); }
.axis .lbl { background: var(--ink); color: var(--on-bar); font: 600 12px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; }
.tick { position: absolute; top: 0; transform: translateX(-50%); padding-top: 13px; font-size: 12px; line-height: 1; font-weight: 500; color: var(--on-bar); white-space: nowrap; }
.tick::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 9px; background: rgba(246, 247, 235, 0.75); }

.lanes { position: relative; }
.grid { position: absolute; left: var(--lw); top: 0; bottom: 0; width: var(--tw); z-index: 1; pointer-events: none; }
.gline { position: absolute; top: 0; bottom: 0; width: 1px; background: repeating-linear-gradient(to bottom, var(--rule-strong) 0 3px, transparent 3px 8px); opacity: 0.45; }
.caprow { margin-top: 16px; border-bottom: 3px solid var(--lc); }
.caprow.first { margin-top: 0; }
.lbl.capl { width: max-content; max-width: min(680px, calc(100vw - 60px)); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 10px 14px 7px 12px; border-right: 0; }
.capl .cn { font-size: 16px; font-weight: 600; line-height: 1.25; }
.capl .cn::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--lc); margin-right: 8px; }
.capl .ds { font-size: 13px; color: var(--ink2); line-height: 1.3; }
.crow { --bgc: var(--card); }
.crow.alt { --bgc: var(--note-bg); background: var(--bgc); }
.crow .lbl { background: var(--bgc); }
.empty { position: sticky; left: calc(var(--lw) + 12px); display: inline-block; margin: 18px 0 0 12px; font-size: 13px; font-style: italic; color: var(--ink2); }

.rail { position: absolute; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
.ext { position: absolute; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--lc) 26%, transparent); }
.node, .range { position: absolute; margin: 0; cursor: pointer; z-index: 2; scroll-margin: 96px 48px; }
.range { display: block; height: 26px; border: 0; border-radius: 5px; background-color: var(--lc); color: var(--on-bar); font: 500 12px var(--f-body); text-align: left; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.range .ico { margin-right: 7px; vertical-align: -2px; }
.range.p1 { background-image: repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.24) 0 5px, transparent 5px 11px); }
.range.p2 { background-image: radial-gradient(rgba(0, 0, 0, 0.28) 1.6px, transparent 1.9px); background-size: 9px 9px; }
.range.p3 { background-image: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.24) 0 2px, transparent 2px 6px); }
.range:hover { background-color: color-mix(in srgb, var(--lc) 82%, var(--ink)); }
.range[aria-pressed="true"] { background-color: color-mix(in srgb, var(--lc) 65%, var(--ink)); box-shadow: 0 0 0 2px var(--bgc, var(--card)), 0 0 0 5px var(--ink); }
.node { z-index: 3; width: 28px; height: 28px; padding: 0; border: 0; background: transparent; border-radius: 6px; }
.node svg { display: block; width: 28px; height: 28px; overflow: visible; transform: scale(var(--sc, 1)); }
.node .fill { fill: var(--lc); stroke: var(--bgc, var(--card)); stroke-width: 3; paint-order: stroke fill; stroke-linejoin: round; }
.node .open { fill: var(--bgc, var(--card)); stroke: var(--lc); stroke-width: 3.6; stroke-linejoin: round; }
.node .ring { fill: none; stroke: var(--ink); stroke-width: 2.6; opacity: 0; }
.node:hover { --sc: 1.14; }
.node[aria-pressed="true"] .ring { opacity: 1; }
.node[aria-pressed="true"] { --sc: 1.1; }
.nlabel { position: absolute; width: 90px; text-align: center; font-size: 12px; line-height: 1.2; color: var(--ink2); pointer-events: none; }
.nlabel.on { color: var(--ink); font-weight: 600; background: var(--highlight); border-radius: 4px; padding: 1px 3px; }
.hint { font-size: 13px; color: var(--ink2); margin: 8px 2px 0; max-width: 90ch; }

/* list view: the same events as a plain table */
.listwrap { border-radius: 10px; background: var(--card); overflow: auto; border: 3px solid var(--rule); }
@media (min-width: 900px) { .listwrap { max-height: calc(100vh - 200px); } }
.ltable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ltable caption { text-align: left; padding: 12px 14px; font-size: 13px; color: var(--ink2); }
.ltable th { position: sticky; top: 0; z-index: 2; background: var(--ink); color: var(--on-bar); text-align: left; font: 600 12px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; padding: 9px 14px; }
.ltable td { vertical-align: middle; padding: 9px 14px; }
.ltable tbody tr:nth-child(even) td { background: var(--note-bg); }
.ltable td.d { white-space: nowrap; color: var(--ink2); font-size: 13px; }
.ltable .cat { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: 500; }
.ltable .cat::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--lc); }
.ltable .ev { font: 600 14px var(--f-body); color: var(--ink); background: none; border: 0; padding: 4px 0; text-align: left; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; }
.ltable .ev:hover { background: var(--highlight); }
.ltable .ev[aria-pressed="true"] { background: var(--highlight); box-shadow: inset 4px 0 0 var(--ink); padding-left: 10px; }
.ltable tbody tr:has(.ev[aria-pressed="true"]) td { background: color-mix(in srgb, var(--highlight) 24%, var(--card)); }

/* reading panel */
.panel { background: var(--panel); border-top: 6px solid var(--lc, var(--ink)); border-radius: 10px; padding: 18px 22px 20px; }
.panel h2 { font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.2; margin: 12px 0 8px; text-wrap: balance; }
.panel h3 { font: 600 12px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); margin: 22px 0 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: color-mix(in srgb, var(--lc) calc(var(--tint-chip) + 6%), var(--panel)); border-radius: 4px; padding: 2px 9px; font-size: 13px; font-weight: 600; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lc); }
.era-tag { color: var(--ink2); }
.lead { margin: 0; font-size: 15.5px; }
.panel ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.care { background: var(--card); border-left: 5px solid var(--lc, var(--ink2)); border-radius: 0 6px 6px 0; padding: 10px 12px; font-size: 14px; margin: 0; }
.team { background: color-mix(in srgb, var(--highlight) 38%, var(--panel)); border-left: 5px solid var(--ink); border-radius: 0 6px 6px 0; padding: 10px 12px; font-size: 14px; margin: 0; }
.team a { font-weight: 500; }
.srcs { list-style: none; padding: 0; gap: 12px; }
.srcs li { display: block; }
.srcs a { color: var(--ink); font-weight: 500; text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }
.srcs a:hover { text-decoration-thickness: 2px; }
.stype { display: inline-block; margin-left: 6px; font: 500 11px var(--f-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); background: color-mix(in srgb, var(--ink) 10%, var(--panel)); border-radius: 3px; padding: 1px 6px; vertical-align: 1px; white-space: nowrap; }
.why { display: block; color: var(--ink2); font-size: 14px; margin-top: 2px; }
.nav { display: flex; gap: 8px; align-items: center; margin-top: 24px; }
.nav button, .start { min-height: 32px; font: 500 13px var(--f-body); color: var(--ink); background: var(--band); border: 0; border-radius: 6px; padding: 6px 13px; cursor: pointer; }
.nav button:hover, .start:hover { background: var(--highlight); }
.nav button:disabled { opacity: 0.4; cursor: default; }
.nav .pos { margin-left: auto; font: 400 13px var(--f-body); color: var(--ink2); }
.legend { list-style: none; padding: 0; gap: 8px; }
.legend li { display: flex; gap: 10px; align-items: baseline; }
.legend i { flex: none; width: 13px; height: 13px; border-radius: 50%; background: var(--lc); position: relative; top: 1px; }
.legend b { font-weight: 600; }
.legend span { color: var(--ink2); }
.shapes { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.shapes li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.sample { display: inline-block; width: 64px; height: 22px; border-radius: 5px; background-color: var(--ink); }
.sample.p1 { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0 5px, transparent 5px 11px); }
.sample.p2 { background-image: radial-gradient(rgba(255, 255, 255, 0.5) 1.6px, transparent 1.9px); background-size: 9px 9px; }
.sample.p3 { background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.4) 0 2px, transparent 2px 6px); }

@media (max-width: 640px) {
  :root { --lw: 108px; }
  .panel { padding: 14px 16px 14px; }
  .tl, .listwrap { border-radius: 6px; }
  .ltable th, .ltable td { padding-inline: 10px; }
  .ltable .hide-s { display: none; }
}
@media (forced-colors: active) {
  .range { border: 1px solid CanvasText; }
  .node svg, .ct, .ico { forced-color-adjust: none; }
}
@media (prefers-reduced-motion: reduce) { .node:hover { --sc: 1; } }
</style>
</head>
<body>
<a class="skip" href="#panel">Skip to the details panel</a>
<div class="page">
  <header>
    <a class="back" href="index.html">&larr; All charts</a>
    <h1><span class="mark">Dog Timeline</span></h1>
    <p class="sub">How dogs have been used, viewed and lived with, country by country. Korea is the main timeline; switch on other countries to compare. Select any marker or bar for the detail and the sources behind it.</p>
  </header>

  <main id="main">
    <div class="toolbar">
      <fieldset class="tgroup" id="g-countries"><legend class="gl">Show countries</legend><div class="chips" id="countries"></div></fieldset>
      <fieldset class="tgroup" id="g-view"><legend class="gl">View as</legend><div class="segr" id="view"></div></fieldset>
      <fieldset class="tgroup" id="g-scale"><legend class="gl">Time scale</legend><div class="segr" id="scale"></div></fieldset>
      <nav class="tgroup" id="g-jump" aria-labelledby="gl-j"><div class="gl" id="gl-j">Jump to</div><div class="jumpset" id="jump"></div></nav>
    </div>
    <div class="key" id="key" aria-label="Category colours"></div>

    <div class="layout">
      <div>
        <div class="tl" id="tl" role="region" aria-label="Timeline of dogs, scrolls sideways and down" tabindex="0"><div class="canvas" id="canvas"></div></div>
        <div class="listwrap" id="list" role="region" aria-label="List of events" tabindex="0" hidden></div>
        <p class="hint" id="hint"></p>
      </div>
      <aside class="panel" id="panel" role="region" aria-label="Details" tabindex="-1"><noscript>This timeline needs JavaScript to draw.</noscript></aside>
    </div>
  </main>
  <p class="sr" id="status" role="status" aria-live="polite"></p>
</div>

<script src="data/categories.js"></script>
<script src="data/korea.js"></script>
<script src="data/netherlands.js"></script>
<script>
(function () {
  "use strict";
  var D = window.DOGTL;
  var panel = document.getElementById("panel");
  if (!D || !D.categories || !D.countries || !D.countries.length) {
    panel.textContent = "The timeline data did not load.";
    return;
  }

  var CATS = D.categories;
  // The main country always comes first, so it sits on top inside every category.
  var COUNTRIES = D.countries.slice().sort(function (a, b) { return (b.main ? 1 : 0) - (a.main ? 1 : 0); });
  // Each country gets a marker shape, a bar pattern and a label style, so it can be told apart without colour.
  var SHAPES = ["circle", "diamond", "square", "triangle"];
  var SHAPE_NAMES = ["filled circle", "open diamond", "filled square", "filled triangle"];
  var PATTERN_NAMES = ["plain bars", "striped bars", "dotted bars", "lined bars"];
  var on = {};
  var byId = {};
  COUNTRIES.forEach(function (c, i) {
    on[c.id] = true;
    c.i = i % 4; c.shape = SHAPES[i % 4]; c.shapeName = SHAPE_NAMES[i % 4]; c.patternName = PATTERN_NAMES[i % 4];
    c.events.forEach(function (e) { e.country = c; byId[e.id] = e; });
  });

  // Compressed scale: each period gets a fixed width, so the sparse early centuries take less room
  // than the busy recent ones. Even scale: one fixed number of pixels per year.
  var BREAKS = [-6000, -300, 700, 1500, 1800, 1945, 2000, 2027];
  var WIDTHS = [120, 430, 160, 300, 340, 480, 900];
  var BAND_NAMES = ["Before 300 BCE", "300 BCE to 700 CE", "700 to 1500", "1500 to 1800", "1800 to 1945", "1945 to 2000", "2000 to today"];
  var TICKS = {
    compressed: [-6000, -300, 0, 500, 700, 1000, 1500, 1800, 1900, 1945, 1970, 2000, 2010, 2020, 2026],
    even: [-6000, -5000, -4000, -3000, -2000, -1000, 0, 500, 1000, 1500, 2000]
  };
  var PAD = 56, EVEN_K = 0.45;
  var BAR_H = 38, DOT_H = 76, ROW_PAD = 8, LAB = 45; // LAB = half the width of a dot label
  var mode = "compressed", view = "chart";

  function x(y) {
    if (mode === "even") return PAD + (y - BREAKS[0]) * EVEN_K;
    var acc = 0, last = WIDTHS.length - 1;
    if (y <= BREAKS[0]) return PAD + (y - BREAKS[0]) * WIDTHS[0] / (BREAKS[1] - BREAKS[0]);
    for (var i = 0; i <= last; i++) {
      var a = BREAKS[i], b = BREAKS[i + 1];
      if (y <= b || i === last) return PAD + acc + (y - a) * WIDTHS[i] / (b - a);
      acc += WIDTHS[i];
    }
  }
  function trackWidth() { return Math.ceil(x(BREAKS[BREAKS.length - 1]) + PAD); }
  function fmtYear(y) { return y < 0 ? (-y) + " BCE" : (y > 0 && y < 1000 ? y + " CE" : (y === 0 ? "1 CE" : String(y))); }

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  var NS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs) { var n = document.createElementNS(NS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); return n; }
  // A marker shape drawn as SVG. Solid shapes are filled; the diamond is an open outline, which stays
  // obvious in greyscale and at low vision.
  function shapeEl(shape) {
    if (shape === "circle") return sv("circle", { cx: 14, cy: 14, r: 9.5, "class": "fill" });
    if (shape === "diamond") return sv("path", { d: "M14 3.5 L24.5 14 L14 24.5 L3.5 14 Z", "class": "open" });
    if (shape === "square") return sv("rect", { x: 5, y: 5, width: 18, height: 18, rx: 3, "class": "fill" });
    return sv("path", { d: "M14 4 L25.5 24 L2.5 24 Z", "class": "fill" });
  }
  function icon(shape, size, cls) {
    var s = sv("svg", { viewBox: "0 0 28 28", width: size, height: size, "aria-hidden": "true", focusable: "false", "class": "ico " + (cls || "") });
    s.appendChild(shapeEl(shape));
    return s;
  }
  function reduce() { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } }
  function eraOf(c, y) {
    var eras = c.eras || [];
    for (var i = 0; i < eras.length; i++) { if (y >= eras[i].from && y < eras[i].to) return eras[i].n; }
    if (eras.length && y === eras[eras.length - 1].to) return eras[eras.length - 1].n;
    return "";
  }
  function catColour(k) { return "var(--c-" + k + ")"; }
  function catOf(k) { return CATS.filter(function (c) { return c.k === k; })[0]; }
  function visible() { return COUNTRIES.filter(function (c) { return on[c.id]; }); }
  function ctag(c) {
    var s = el("span", "ct v" + c.i);
    s.appendChild(icon(c.shape, 16));
    s.appendChild(document.createTextNode(c.name));
    return s;
  }

  // ---- layout of one row (one country inside one category) ----
  function pack(list) {
    list.sort(function (a, b) { return a.lo - b.lo; });
    var ends = [];
    list.forEach(function (it) {
      var l = 0;
      while (l < ends.length && ends[l] > it.lo - 4) l++;
      ends[l] = it.hi; it.lvl = l;
    });
    return ends.length;
  }
  function layoutRow(events) {
    var bars = [], dots = [];
    events.forEach(function (e) {
      var x1 = x(e.start), x2 = e.end != null ? x(e.end) : x1;
      if (e.bar && e.end != null) {
        var w = Math.max(x2 - x1, 84);
        bars.push({ e: e, left: x1, width: w, lo: x1 - 4, hi: x1 + w + 4 });
      } else {
        var mid = e.end != null ? (e.start + e.end) / 2 : e.start;
        var cx = x(mid), lo = cx - LAB, hi = cx + LAB, ext = null;
        if (e.end != null && x2 - x1 > 24) { ext = { left: x1, width: x2 - x1 }; lo = Math.min(lo, x1); hi = Math.max(hi, x2); }
        dots.push({ e: e, cx: cx, ext: ext, lo: lo, hi: hi });
      }
    });
    return { bars: bars, dots: dots, nb: pack(bars), nd: pack(dots) };
  }

  // ---- drawing ----
  var canvas = document.getElementById("canvas");
  var tl = document.getElementById("tl");
  var listEl = document.getElementById("list");
  var hint = document.getElementById("hint");
  var status = document.getElementById("status");
  var labels = {}, order = [], current = null;

  function pick(id) { return document.querySelectorAll('[data-ev="' + id + '"]'); }
  function setPressed(id, state) {
    var n = pick(id);
    for (var i = 0; i < n.length; i++) n[i].setAttribute("aria-pressed", state ? "true" : "false");
    if (labels[id]) labels[id].classList.toggle("on", state);
  }
  function eventButton(id) { return document.querySelector((view === "list" ? ".ltable " : ".canvas ") + '[data-ev="' + id + '"]'); }

  function mkEvent(e, tr, y0, item, isBar) {
    var b = el("button");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("data-ev", e.id);
    var what = e.country.name + ", " + e.date + ": " + e.title;
    b.setAttribute("aria-label", what);
    b.title = what;
    b.style.setProperty("--lc", catColour(e.cat));
    if (isBar) {
      b.className = "range p" + e.country.i;
      b.appendChild(icon(e.country.shape, 14));
      b.appendChild(document.createTextNode(e.bar));
      b.style.left = item.left + "px"; b.style.width = item.width + "px";
      b.style.top = (y0 + item.lvl * BAR_H + 6) + "px";
    } else {
      var top = y0 + item.lvl * DOT_H, cy = top + 20;
      if (item.ext) {
        var ex = el("div", "ext");
        ex.style.setProperty("--lc", catColour(e.cat));
        ex.style.left = item.ext.left + "px"; ex.style.width = item.ext.width + "px"; ex.style.top = (cy - 4) + "px";
        tr.appendChild(ex);
      }
      b.className = "node";
      b.style.left = (item.cx - 14) + "px"; b.style.top = (cy - 14) + "px";
      var s = sv("svg", { viewBox: "0 0 28 28", "aria-hidden": "true", focusable: "false" });
      s.appendChild(shapeEl(e.country.shape));
      s.appendChild(sv("circle", { cx: 14, cy: 14, r: 13, "class": "ring" }));
      b.appendChild(s);
      var lab = el("div", "nlabel", e.tag);
      lab.style.left = (item.cx - LAB) + "px"; lab.style.top = (cy + 17) + "px";
      tr.appendChild(lab);
      labels[e.id] = lab;
    }
    b.addEventListener("click", function () { select(e.id, true); });
    tr.appendChild(b);
  }

  function build() {
    var shown = visible();
    var tw = trackWidth();
    canvas.textContent = "";
    canvas.style.setProperty("--tw", tw + "px");
    labels = {};

    // sticky header: one period ribbon per country, then the year axis
    var head = el("div", "head");
    shown.forEach(function (c) {
      var row = el("div", "row eras");
      var lbl = el("div", "lbl");
      lbl.appendChild(ctag(c));
      row.appendChild(lbl);
      var tr = el("div", "track");
      (c.eras || []).forEach(function (er, i) {
        var d = el("div", "era" + (i % 2 ? " alt" : ""), er.n);
        d.style.left = x(er.from) + "px";
        d.style.width = Math.max(x(er.to) - x(er.from) - 2, 4) + "px";
        tr.appendChild(d);
      });
      row.appendChild(tr);
      head.appendChild(row);
    });
    var axis = el("div", "row axis");
    axis.appendChild(el("div", "lbl", "Year"));
    var at = el("div", "track");
    TICKS[mode].forEach(function (y) { var t = el("div", "tick", fmtYear(y)); t.style.left = x(y) + "px"; at.appendChild(t); });
    axis.appendChild(at);
    head.appendChild(axis);
    canvas.appendChild(head);

    // category blocks: a caption row, then one labelled row per country
    var lanes = el("div", "lanes");
    var grid = el("div", "grid");
    TICKS[mode].forEach(function (y) { var g = el("div", "gline"); g.style.left = x(y) + "px"; grid.appendChild(g); });
    lanes.appendChild(grid);

    CATS.forEach(function (cat, ci) {
      var caprow = el("div", "row caprow" + (ci === 0 ? " first" : ""));
      caprow.style.setProperty("--lc", catColour(cat.k));
      var capl = el("div", "lbl capl");
      capl.appendChild(el("span", "cn", cat.n));
      capl.appendChild(el("span", "ds", cat.d));
      caprow.appendChild(capl);
      lanes.appendChild(caprow);

      shown.forEach(function (c, ki) {
        var evs = c.events.filter(function (e) { return e.cat === cat.k; })
          .sort(function (a, b) { return a.start - b.start || a.seq - b.seq; });
        var lay = layoutRow(evs);
        var y0 = ROW_PAD;
        var h = evs.length ? ROW_PAD * 2 + lay.nb * BAR_H + lay.nd * DOT_H : 56;
        var row = el("div", "row crow" + (ki % 2 ? " alt" : ""));
        row.style.setProperty("--lc", catColour(cat.k));
        var lbl = el("div", "lbl");
        lbl.appendChild(ctag(c));
        row.appendChild(lbl);
        var tr = el("div", "track");
        tr.style.height = h + "px";
        if (!evs.length) {
          tr.appendChild(el("span", "empty", "No entries yet"));
        } else {
          var dotTop = y0 + lay.nb * BAR_H;
          // one rail per level, running from its first marker to its last
          for (var l = 0; l < lay.nd; l++) {
            var from = Infinity, to = -Infinity;
            lay.dots.forEach(function (it) {
              if (it.lvl !== l) return;
              from = Math.min(from, it.ext ? it.ext.left : it.cx);
              to = Math.max(to, it.ext ? it.ext.left + it.ext.width : it.cx);
            });
            if (to > from) {
              var rail = el("div", "rail");
              rail.style.left = from + "px"; rail.style.width = (to - from) + "px";
              rail.style.top = (dotTop + l * DOT_H + 19) + "px";
              tr.appendChild(rail);
            }
          }
          lay.bars.forEach(function (it) { mkEvent(it.e, tr, y0, it, true); });
          lay.dots.forEach(function (it) { mkEvent(it.e, tr, dotTop, it, false); });
        }
        row.appendChild(tr);
        lanes.appendChild(row);
      });
    });
    canvas.appendChild(lanes);

    order = [];
    shown.forEach(function (c) { order = order.concat(c.events); });
    order.sort(function (a, b) { return a.start - b.start || COUNTRIES.indexOf(a.country) - COUNTRIES.indexOf(b.country) || a.seq - b.seq; });
    order.forEach(function (e, i) { e.i = i; });
    buildList();

    hint.textContent = "Each category has one row per country, labelled on the left. Countries are also told apart by marker and bar style: " +
      COUNTRIES.map(function (c) { return c.name + " is a " + c.shapeName + " and " + c.patternName; }).join("; ") + ". Position is the year. " +
      (mode === "compressed"
        ? "On the compressed scale the busy recent centuries get more room than the long early ones, so distances are not to scale. "
        : "On the even scale distance is time, so recent years are crowded. ") +
      "A faint bar behind a marker means the date is only known as a rough range. Scroll sideways, or use the jump buttons. Arrow keys step through entries. The List view shows the same events as a table.";
    tl.classList.toggle("scrolled", tl.scrollLeft > 2);

    if (current && byId[current] && on[byId[current].country.id]) {
      setPressed(current, true);
      render(byId[current]);
    } else {
      current = null;
      intro();
    }
  }
  tl.addEventListener("scroll", function () { tl.classList.toggle("scrolled", tl.scrollLeft > 2); }, { passive: true });

  // ---- the same events as a plain table ----
  function buildList() {
    listEl.textContent = "";
    var t = el("table", "ltable");
    t.appendChild(el("caption", null, "All events in date order, for the countries switched on. Select an event to read its sources in the details panel."));
    var thead = el("thead"), hr = el("tr");
    [["Date", ""], ["Country", ""], ["Category", "hide-s"], ["Event", ""]].forEach(function (h) {
      var th = el("th", h[1], h[0]); th.scope = "col"; hr.appendChild(th);
    });
    thead.appendChild(hr); t.appendChild(thead);
    var tb = el("tbody");
    order.forEach(function (e) {
      var tr = el("tr");
      tr.appendChild(el("td", "d", e.date));
      var tc = el("td"); tc.appendChild(ctag(e.country)); tr.appendChild(tc);
      var tk = el("td", "hide-s");
      var cs = el("span", "cat", catOf(e.cat).n); cs.style.setProperty("--lc", catColour(e.cat));
      tk.appendChild(cs); tr.appendChild(tk);
      var te = el("td");
      var b = el("button", "ev", e.title);
      b.type = "button"; b.setAttribute("aria-pressed", "false"); b.setAttribute("data-ev", e.id);
      b.addEventListener("click", function () { select(e.id, true); });
      te.appendChild(b); tr.appendChild(te);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    listEl.appendChild(t);
  }

  // ---- controls ----
  // A filter: tick any combination (real checkboxes).
  function checkbox(group, text, checked, shape, onChange) {
    var lab = el("label", "chk");
    var inp = el("input");
    inp.type = "checkbox"; inp.checked = checked;
    inp.addEventListener("change", function () { onChange(inp); });
    lab.appendChild(inp);
    var box = el("span", "box"); box.setAttribute("aria-hidden", "true");
    lab.appendChild(box);
    if (shape) lab.appendChild(icon(shape, 16));
    lab.appendChild(el("span", "nm", text));
    group.appendChild(lab);
    return inp;
  }
  // A switch: pick exactly one (real radio buttons).
  function radios(group, name, options, value, onChange) {
    options.forEach(function (o) {
      var lab = el("label", "sw");
      var inp = el("input");
      inp.type = "radio"; inp.name = name; inp.value = o[0]; inp.checked = o[0] === value;
      inp.addEventListener("change", function () { if (inp.checked) onChange(o[0]); });
      lab.appendChild(inp);
      lab.appendChild(el("span", "t", o[1]));
      group.appendChild(lab);
    });
  }
  var cg = document.getElementById("countries");
  COUNTRIES.forEach(function (c) {
    checkbox(cg, c.name + (c.main ? " (main)" : ""), true, c.shape, function (inp) {
      if (!inp.checked && visible().length === 1) { // always keep one country on screen
        inp.checked = true;
        status.textContent = "Keep at least one country switched on.";
        return;
      }
      on[c.id] = inp.checked;
      build();
    });
  });
  radios(document.getElementById("view"), "view", [["chart", "Timeline"], ["list", "List"]], view, function (v) {
    view = v;
    applyView();
    showCurrent();
  });
  function applyView() {
    var chart = view === "chart";
    tl.hidden = !chart; hint.hidden = !chart; listEl.hidden = chart;
    document.getElementById("g-scale").hidden = !chart;
    document.getElementById("g-jump").hidden = !chart;
    document.getElementById("key").hidden = !chart;
  }
  function showCurrent() {
    if (!current) return;
    var b = eventButton(current);
    if (b) { try { b.scrollIntoView({ inline: "center", block: "nearest", behavior: "auto" }); } catch (e) {} }
  }
  radios(document.getElementById("scale"), "scale", [["compressed", "Compressed"], ["even", "Even time"]], mode, function (v) {
    mode = v;
    build();
    if (current) showCurrent(); else tl.scrollLeft = 0;
  });
  var jg = document.getElementById("jump");
  BAND_NAMES.forEach(function (name, i) {
    var b = el("button", null, name);
    b.type = "button";
    b.addEventListener("click", function () {
      tl.scrollTo({ left: Math.max(x(BREAKS[i]) - 12 - (i === 0 ? PAD : 0), 0), behavior: reduce() ? "auto" : "smooth" });
    });
    jg.appendChild(b);
  });
  var key = document.getElementById("key");
  CATS.forEach(function (c) {
    var s = el("span");
    s.style.setProperty("--lc", catColour(c.k));
    s.appendChild(el("i"));
    s.appendChild(el("b", null, c.n));
    key.appendChild(s);
  });

  // ---- reading panel ----
  function intro() {
    panel.textContent = "";
    panel.style.setProperty("--lc", "var(--ink)");
    var h = el("h2", null, "How to read this");
    h.style.marginTop = "0";
    panel.appendChild(h);
    panel.appendChild(el("p", "lead", "Each block is a category, with one row for each country you switch on. Each marker is a dated event or find; each bar is something that lasted across a long span. Select one to see what the sources say and where to read them. Prefer a table? Choose List under View."));
    panel.appendChild(el("h3", null, "Countries"));
    var sh = el("ul", "shapes");
    COUNTRIES.forEach(function (c) {
      var li = el("li");
      li.appendChild(ctag(c));
      li.appendChild(el("span", null, c.shapeName + " markers, " + c.patternName));
      var smp = el("span", "sample p" + c.i);
      smp.setAttribute("aria-hidden", "true");
      li.appendChild(smp);
      sh.appendChild(li);
    });
    panel.appendChild(sh);
    panel.appendChild(el("h3", null, "Categories"));
    var ul = el("ul", "legend");
    CATS.forEach(function (c) {
      var li = el("li");
      li.style.setProperty("--lc", catColour(c.k));
      li.appendChild(el("i"));
      var t = el("div");
      t.appendChild(el("b", null, c.n + ". "));
      t.appendChild(el("span", null, c.d + "."));
      li.appendChild(t); ul.appendChild(li);
    });
    panel.appendChild(ul);
    panel.appendChild(el("h3", null, "Reading the evidence"));
    panel.appendChild(el("p", "care", "Every entry has a ‘Read with care’ note that says how the claim is sourced: for example, a date that rests on one scholar’s post, or a text read only through Wikipedia. Source types are labelled so you can see what kind of document each link is."));
    var nav = el("div", "nav");
    var st = el("button", "start", "Start at the beginning");
    st.type = "button";
    st.addEventListener("click", function () { if (order.length) select(order[0].id, true); });
    nav.appendChild(st);
    panel.appendChild(nav);
  }

  function select(id, scroll) {
    var e = byId[id];
    if (!e || !pick(id).length) return;
    if (current) setPressed(current, false);
    current = id;
    setPressed(id, true);
    try { history.replaceState(null, "", "#" + id); } catch (x) {}
    render(e);
    status.textContent = "Selected: " + e.country.name + ", " + e.date + ", " + e.title + ". The details are in the panel.";
    if (scroll) {
      var b = eventButton(id);
      if (b) { try { b.scrollIntoView({ inline: "center", block: "nearest", behavior: reduce() ? "auto" : "smooth" }); } catch (x) {} }
      if (window.innerWidth < 1100) { try { panel.scrollIntoView({ block: "nearest", behavior: reduce() ? "auto" : "smooth" }); } catch (x) {} }
    }
  }

  function render(e) {
    var c = e.country;
    var cat = catOf(e.cat);
    panel.textContent = "";
    panel.style.setProperty("--lc", catColour(e.cat));
    var meta = el("div", "meta");
    meta.appendChild(el("span", "date", e.date));
    var chip = el("span", "chip", cat ? cat.n : e.cat);
    chip.style.setProperty("--lc", catColour(e.cat));
    meta.appendChild(chip);
    meta.appendChild(ctag(c));
    var era = eraOf(c, e.start);
    if (era) meta.appendChild(el("span", "era-tag", era));
    if (e.approx) meta.appendChild(el("span", "era-tag", "Date is approximate"));
    panel.appendChild(meta);
    panel.appendChild(el("h2", null, e.title));
    panel.appendChild(el("p", "lead", e.sum));
    panel.appendChild(el("h3", null, "What the sources say"));
    var ul = el("ul");
    e.pts.forEach(function (p) { ul.appendChild(el("li", null, p)); });
    panel.appendChild(ul);
    if (e.care) {
      panel.appendChild(el("h3", null, "Read with care"));
      panel.appendChild(el("p", "care", e.care));
    }
    panel.appendChild(el("h3", null, "Sources"));
    var sl = el("ul", "srcs");
    e.src.forEach(function (s) {
      var d = c.sources[s.s];
      var li = el("li");
      var a = el("a", null, d.t);
      a.href = d.u; a.target = "_blank"; a.rel = "noopener noreferrer";
      li.appendChild(a);
      li.appendChild(el("span", "stype", d.k));
      li.appendChild(el("span", "why", "Why it matters: " + s.why));
      sl.appendChild(li);
    });
    panel.appendChild(sl);
    if (e.team && c.teamDoc) {
      panel.appendChild(el("h3", null, "Link to your team research"));
      var tp = el("p", "team");
      var ta = el("a", null, e.team.t);
      ta.href = c.teamDoc; ta.target = "_blank"; ta.rel = "noopener noreferrer";
      tp.appendChild(ta);
      tp.appendChild(document.createTextNode(". " + e.team.n));
      panel.appendChild(tp);
    }
    var nav = el("div", "nav");
    var prev = el("button", null, "← Previous"); prev.type = "button";
    var next = el("button", null, "Next →"); next.type = "button";
    prev.disabled = e.i === 0; next.disabled = e.i === order.length - 1;
    prev.addEventListener("click", function () { step(-1); });
    next.addEventListener("click", function () { step(1); });
    nav.appendChild(prev); nav.appendChild(next);
    nav.appendChild(el("span", "pos", (e.i + 1) + " of " + order.length));
    panel.appendChild(nav);
    panel.scrollTop = 0;
  }

  function step(d) {
    if (!current) return;
    var n = byId[current].i + d;
    if (n >= 0 && n < order.length) select(order[n].id, true);
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    var t = ev.target && ev.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    if (!current) return;
    ev.preventDefault();
    step(ev.key === "ArrowRight" ? 1 : -1);
  });

  var h = (location.hash || "").replace("#", "");
  if (h && byId[h]) current = h;
  applyView();
  build();
  if (current) showCurrent();
})();
</script>
</body>
</html>
