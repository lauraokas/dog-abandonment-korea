<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Team 2</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border-radius: 8px;
    padding: 32px 28px;
  }
  .tag {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    display: inline-block;
  }
  h1 {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: 30px;
    line-height: 1.2;
    margin: 12px 0 12px;
  }
  p { margin: 0 0 24px; color: var(--ink2); line-height: 1.5; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a {
    display: block;
    padding: 12px 16px;
    background: var(--note-bg);
    border-radius: 6px;
    color: var(--accent);
    font-weight: 500;
    text-decoration: none;
  }
  a:hover, a:focus-visible { background: var(--highlight); color: var(--ink); }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="tag">Work in progress</div>
  <h1><span class="mark">Dog Team 2</span></h1>
  <p>Research and graph work in progress.</p>
  <ul>
    <li><a href="timeline.html">Dog timeline: Korea and the Netherlands &rarr;</a></li>
    <li><a href="dutch-dog-timeline.html">Dutch dog timeline (earlier version) &rarr;</a></li>
    <li><a href="korean-dog-timeline.html">Korean dog timeline (earlier version) &rarr;</a></li>
  </ul>
</main>
</body>
</html>
