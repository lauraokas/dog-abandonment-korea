<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Team 2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f5f4;
    --panel: #fbfcfb;
    --ink: #17211d;
    --muted: #5d6b66;
    --line: #d3dbd8;
    --accent: #3b5f94;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 32px 28px;
  }
  .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: "IBM Plex Serif", Georgia, serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.2;
    margin: 8px 0 12px;
  }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a {
    display: block;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--accent);
    font-weight: 500;
    text-decoration: none;
  }
  a:hover, a:focus-visible { border-color: var(--accent); background: #eef2f8; }
</style>
</head>
<body>
<main>
  <div class="tag">Work in progress</div>
  <h1>Dog Team 2</h1>
  <p>Research and graph work in progress.</p>
  <ul>
    <li><a href="dutch-dog-timeline.html">Dutch dog timeline &rarr;</a></li>
    <li><a href="korean-dog-timeline.html">Korean dog timeline &rarr;</a></li>
  </ul>
</main>
</body>
</html>
